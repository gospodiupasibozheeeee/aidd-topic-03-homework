{% load static %}
<!doctype html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Investing · Вход</title>
    <link href="{% static 'user/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'user/css/signin.css' %}" rel="stylesheet">
    <style>
        .errorlist { color: #dc3545; margin: 0.25rem 0 0; padding-left: 0; list-style: none; font-size: 0.875rem; }

</head>
<body>
<main class="form-signin">

        {% for message in messages %}

</main>
</body>
</html>
