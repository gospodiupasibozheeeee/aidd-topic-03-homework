{% extends "dashboard/base.html" %}

{% block title %}<title>Удаление акции</title>{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-danger">
                <div class="card-body">
                    <h1 class="h4 mb-3">Удаление акции</h1>
                    <p>
                        Вы уверены, что хотите удалить инструмент
                        <strong>{{ share.ticker }} — {{ share.name }}</strong>?
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">Удалить</button>
                            <a href="{% url 'dashboard:index' %}" class="btn btn-outline-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
