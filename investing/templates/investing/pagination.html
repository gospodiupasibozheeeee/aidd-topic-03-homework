{% if page_obj.has_other_pages %}<nav class="my-3" aria-label="Страницы">
{% if page_obj.has_previous %}<a class="btn btn-outline-primary" href="{% querystring page=page_obj.previous_page_number %}">Назад</a>{% endif %}
<span class="mx-3">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a class="btn btn-outline-primary" href="{% querystring page=page_obj.next_page_number %}">Далее</a>{% endif %}
</nav>{% endif %}
